    <style>
   body{
    font-family: Arial;
}

.kepek{
    display:inline-block;
    margin:10px;
    text-align:center;
}

.kepek img{
    width:200px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.kepek img:hover{
    transform:scale(1.05);
}

#hatter{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    opacity:0.7;
    z-index:999;
}

#nagykepAblak{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    border-radius:15px;
    z-index:1000;
    text-align:center;
}

#nagykepAblak img{
    max-width:600px;
    max-height:500px;
    border-radius:10px;
}

#bezarGomb{
    position:absolute;
    top:10px;
    right:10px;
    border:none;
    background:red;
    color:white;
    padding:5px 10px;
    cursor:pointer;
    border-radius:5px;
}
    </style>
